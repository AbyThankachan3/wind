# Wind pipeline — Docker Compose.
#
# Quick start:
#   1. Edit the volume line below to a host folder with 100+ GB free.
#   2. docker compose up --build
#
# Everything (downloads, intermediate files, final COGs, and the boundary
# shapefile) is written to that host folder, so it survives restarts and you
# never re-download files you already have.

services:
  wind:
    build: .
    image: wind-pipeline

    # ---- CHANGE ME ----------------------------------------------------------
    # Left of the colon = a folder on YOUR machine (needs 100+ GB free).
    # Right of the colon = /data inside the container (do not change).
    volumes:
      - "./data:/data"
      # Examples:
      #   - "D:/WindData:/data"            (Windows)
      #   - "/mnt/bigdisk/wind:/data"      (Linux)
      #   - "/Users/me/wind-data:/data"    (macOS)
    # -------------------------------------------------------------------------

    environment:
      # ---- WHICH COUNTRIES ----
      # One country:
      WIND_COUNTRY: "Canada"
      # ...or process several in one run (raw data downloaded once, shared):
      #   WIND_COUNTRIES: "all"            # every registered country (4)
      #   WIND_COUNTRIES: "Canada,UK"      # a specific list
      # (If WIND_COUNTRIES is set it takes precedence over WIND_COUNTRY.)

      # ---- PATHS (base folder; per-country paths derive from it) ----
      WIND_DATA_ROOT: "/data"
      WIND_GIS_DIR: "/data/gis"

      # ---- TUNING ----
      WIND_DOWNLOAD_WORKERS: "6"
      WIND_PROCESS_WORKERS: "2"   # 16GB RAM->1, 32GB->4, 64GB->6
      # WIND_YEARS: "2030,2040,2050,2060,2070,2080,2090,2100"
      # WIND_SSPS: "ssp245,ssp585"
      # WIND_KEEP_INTERMEDIATE: "1"   # keep derived/_multimodel instead of deleting


    # The pipeline is a long batch job, not a service: run once and exit.
    restart: "no"
